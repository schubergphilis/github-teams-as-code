name: Manage GitHub Teams

on:
  #pull_request:
  #  paths:
  #    - 'teams/*.yml'
  #  types:
  #    - opened
  #    - edited
  push:
    branches:
      - '**'

jobs:
  manage_teams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install PyYAML requests

      - name: Validate and Update Teams
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TAC }}
        run: |
          python <<EOF
          import os
          import yaml
          import requests
          from pathlib import Path

          org = "schubergphilis"
          token = os.getenv("GITHUB_TOKEN")
          headers = {"Authorization": f"Bearer {token}"}

          teams_dir = Path("teams")
          changed_files = os.getenv("CHANGED_FILES", "").splitlines()

          for file in changed_files:
              if file.startswith("teams/") and file.endswith(".yml"):
                  team_name = Path(file).stem  # Extract team name from filename
                  with open(file, 'r') as f:
                      team_data = yaml.safe_load(f)

                  members = team_data.get("members", [])
                  
                  # Get or create team
                  team_url = f"https://api.github.com/orgs/{org}/teams/{team_name}"
                  team_response = requests.get(team_url, headers=headers)

                  if team_response.status_code == 404:
                      # Create the team if it doesn't exist
                      create_team_response = requests.post(
                          f"https://api.github.com/orgs/{org}/teams",
                          json={"name": team_name},
                          headers=headers,
                      )
                      create_team_response.raise_for_status()

                  # Sync team members
                  for member in members:
                      add_member_url = f"https://api.github.com/orgs/{org}/teams/{team_name}/memberships/{member}"
                      response = requests.put(add_member_url, headers=headers)
                      response.raise_for_status()
          EOF

      - name: Get Changed Files
        id: get_changed_files
        run: |
          echo "CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)" >> $GITHUB_ENV
