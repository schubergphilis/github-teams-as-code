name: Manage GitHub Teams

on:
  push:
    branches:
      - '**'
    #paths:
    #  - "team-config.yml" # Trigger only when this file is updated.

jobs:
  manage-teams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: pip install PyYAML requests

      - name: Parse YAML and Manage Teams
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TAC }}
          ORG_NAME: "neleshgoel84" # Replace with your org name
        run: |
          python <<EOF
          import yaml
          import requests
          import os

          # Load team configuration
          with open('config/teams-config.yml', 'r') as file:
              config = yaml.safe_load(file)

          org_name = os.getenv('ORG_NAME')
          token = os.getenv('GITHUB_TOKEN')
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github.v3+json'
          }

          def create_team(team_name, description):
              url = f"https://api.github.com/orgs/{org_name}/teams"
              payload = {"name": team_name, "description": description, "privacy": "closed"}
              response = requests.post(url, json=payload, headers=headers)
              if response.status_code in [200, 201]:
                  print(f"Team '{team_name}' created or already exists.")
              else:
                  print(f"Failed to create team '{team_name}': {response.json()}")

          def add_member_to_team(team_slug, username):
              url = f"https://api.github.com/orgs/{org_name}/teams/{team_slug}/memberships/{username}"
              response = requests.put(url, headers=headers)
              if response.status_code in [200, 201]:
                  print(f"User '{username}' added to team '{team_slug}'.")
              else:
                  print(f"Failed to add user '{username}' to team '{team_slug}': {response.json()}")

          # Process each team and its members
          for team in config.get('teams', []):
              team_name = team['name']
              description = team.get('description', '')
              members = team.get('members', [])

              # Create the team
              create_team(team_name, description)

              # Add members to the team
              for member in members:
                  add_member_to_team(team_name, member)
          EOF
